services:
    mysql:
        image: mysql:8.4
        container_name: fluxa_mysql

        environment:
            MYSQL_DATABASE: fluxa_finance
            MYSQL_USER: fluxa
            MYSQL_PASSWORD: fluxa123
            MYSQL_ROOT_PASSWORD: root123

        ports:
            - "3306:3306"

        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
